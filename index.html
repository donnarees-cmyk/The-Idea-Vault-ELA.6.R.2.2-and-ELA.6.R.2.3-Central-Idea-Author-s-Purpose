<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Idea Vault | The Literacy Locksmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1530; --bg2:#1a2250; --panel:#fdfcff; --ink:#1b1f3b; --muted:#5d6385; --line:#e3e1f0;
  --cyan:#22d3ee; --pink:#f472b6; --lime:#a3e635; --gold:#fbbf24; --violet:#8b5cf6; --orange:#fb923c;
  --good:#16a34a; --goodbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --hint:#fef3c7; --fix:#e0e7ff; --blue:#4f46e5;
  --disp:'Bungee','Lexend',system-ui,sans-serif; --shadow:0 6px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0; font-family:'Lexend',system-ui,sans-serif; font-size:18px; line-height:1.6; color:var(--ink); min-height:100vh; touch-action:manipulation;
  background:radial-gradient(circle at 8% 12%, rgba(34,211,238,.25) 0 160px, transparent 161px), radial-gradient(circle at 92% 30%, rgba(244,114,182,.22) 0 200px, transparent 201px), radial-gradient(circle at 30% 100%, rgba(139,92,246,.3) 0 260px, transparent 261px), linear-gradient(165deg, var(--bg), #0a0f24)}
button{font-family:inherit; font-size:inherit; cursor:pointer; color:inherit; touch-action:manipulation}
h1,h2,h3,h4{line-height:1.2; margin:0 0 .4em}
.disp{font-family:var(--disp); font-weight:400; letter-spacing:.02em}
.top{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 16px; background:rgba(10,15,36,.92); backdrop-filter:blur(6px); color:#fff; border-bottom:3px solid var(--cyan)}
.top img{width:50px; height:50px; border-radius:12px; background:#fff; object-fit:contain}
.top .t b{font-family:var(--disp); font-size:1.05rem; display:block; line-height:1.1; color:var(--gold)}
.top .t small{font-size:.72rem; color:#c7d2fe; letter-spacing:.05em}
.hud{flex:1; display:flex; align-items:center; gap:10px; justify-content:center; min-width:240px}
.rank{background:var(--violet); border-radius:999px; padding:2px 12px; font-size:.85rem; font-weight:600; white-space:nowrap}
.xpw{flex:1; max-width:240px; height:14px; background:rgba(255,255,255,.15); border-radius:99px; overflow:hidden}
.xpf{height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--lime),var(--gold)); transition:width .6s}
.xpt{font-weight:700; font-size:.9rem; white-space:nowrap}
.tb{background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.25); color:#fff; border-radius:12px; padding:5px 12px; font-size:.85rem}
.tb.on{background:var(--cyan); color:#082f49; border-color:var(--cyan)}
.map{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:12px 16px 2px; max-width:1200px; margin:0 auto}
.stop{padding:5px 12px; border-radius:999px; font-size:.82rem; font-weight:600; background:rgba(255,255,255,.08); color:rgba(255,255,255,.5); border:2px dashed rgba(255,255,255,.22)}
.stop.cur{background:var(--gold); color:#3b2600; border:2px solid #fff}
.stop.done{background:var(--lime); color:#1a2e05; border:2px solid var(--lime); cursor:pointer}
main{max-width:1200px; margin:0 auto; padding:14px 16px 34px}
.panel{background:var(--panel); border-radius:24px; padding:24px; box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.row.c{justify-content:center}
.btn{border:none; border-radius:14px; padding:12px 22px; font-weight:700; font-size:1.05rem; background:var(--gold); color:#3b2600; box-shadow:0 5px 0 #b7791f}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #b7791f}
.btn.go{background:var(--lime); color:#1a2e05; box-shadow:0 5px 0 #65a30d}
.btn.ghost{background:#fff; color:var(--ink); border:2px solid var(--ink); box-shadow:0 5px 0 #c7c9dd}
.btn:disabled{opacity:.45; cursor:not-allowed}
.say{border:2px solid var(--blue); background:#eef2ff; color:var(--blue); border-radius:12px; padding:6px 12px; font-weight:600; font-size:.9rem}
.say.playing{background:var(--blue); color:#fff}
.reading{background:rgba(34,211,238,.28)!important; border-radius:8px; box-shadow:0 0 0 3px rgba(34,211,238,.28)}

/* briefing */
.hero{display:grid; grid-template-columns:200px 1fr; gap:22px; align-items:center}
.hero img{width:200px; height:200px; border-radius:24px; background:#fff; object-fit:contain; box-shadow:0 8px 22px rgba(0,0,0,.15)}
.hero h1{font-family:var(--disp); font-size:clamp(1.8rem,4.6vw,2.8rem); color:var(--violet); margin:0}
.std{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin:18px 0}
.std div{border-radius:16px; padding:14px 16px; color:#fff}
.std .k{font-family:var(--disp); font-size:.85rem; letter-spacing:.05em; opacity:.95; display:block; margin-bottom:4px}
.std .s1{background:linear-gradient(135deg,#4f46e5,#7c3aed)} .std .s2{background:linear-gradient(135deg,#0891b2,#0ea5e9)} .std .s3{background:linear-gradient(135deg,#db2777,#f472b6)}
.how{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px}
.how div{background:#f5f3ff; border-radius:14px; padding:12px; border-left:6px solid var(--violet)}
.how b{display:block}
input.nm{font:inherit; font-size:1.1rem; padding:10px 14px; border-radius:12px; border:3px solid var(--violet); min-width:240px}

/* lesson */
.lcard{display:grid; grid-template-columns:1fr; gap:14px}
.lhead{display:flex; align-items:center; gap:12px}
.lhead .ic{font-size:2.6rem}
.lhead h2{font-family:var(--disp); font-size:1.6rem; color:var(--violet); margin:0}
.lbody p{margin:.5em 0; background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 14px}
.dots{display:flex; gap:6px}
.dots i{width:12px; height:12px; border-radius:50%; background:#d6d3e8; display:block}
.dots i.on{background:var(--pink); transform:scale(1.3)}
.checkwrap{border:3px dashed var(--pink); border-radius:18px; padding:4px}

/* split */
.split{display:grid; grid-template-columns:1.05fr 1fr; gap:16px; align-items:start}
.pane{background:#fff; border-radius:20px; box-shadow:var(--shadow); position:sticky; top:96px; max-height:calc(100vh - 112px); display:flex; flex-direction:column; overflow:hidden}
.tabs{display:flex; background:#ede9fe}
.tabs button{flex:1; border:none; background:transparent; padding:10px 8px; font-weight:700; color:var(--muted); border-bottom:4px solid transparent; font-size:.92rem}
.tabs button.on{background:#fff; color:var(--violet); border-bottom-color:var(--pink)}
.pbody{padding:16px 20px; overflow:auto}
.ptitle{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.ptitle h3{margin:0; color:var(--violet); font-size:1.3rem}
.ptype{display:inline-block; background:#fce7f3; color:#9d174d; border-radius:8px; padding:0 8px; font-size:.78rem; font-weight:700; margin:4px 0 8px}
.para{display:flex; gap:10px; margin-bottom:10px; padding:4px 6px; border-radius:10px; transition:background .3s}
.pn{flex:none; width:30px; height:30px; border-radius:50%; border:2px solid var(--cyan); background:#ecfeff; color:#0e7490; font-weight:700; font-size:.85rem; padding:0}
.pn:hover{background:var(--cyan); color:#fff}
.para p{margin:0}

/* question */
.qtop{display:flex; justify-content:space-between; align-items:center; color:#fff; margin-bottom:10px; gap:8px; flex-wrap:wrap}
.qdots{display:flex; gap:5px; flex-wrap:wrap}
.qdots span{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:.75rem; font-weight:700}
.qdots span.cur{background:var(--gold); color:#3b2600} .qdots span.ok{background:var(--lime); color:#1a2e05} .qdots span.ok2{background:var(--cyan); color:#082f49} .qdots span.miss{background:#f87171}
.qcard{background:var(--panel); border-radius:22px; padding:20px; box-shadow:var(--shadow); animation:pop .3s}
@keyframes pop{from{transform:scale(.96); opacity:0}}
.qhead{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.qnum{background:var(--ink); color:#fff; border-radius:999px; padding:3px 12px; font-size:.88rem; font-weight:700}
.tries{font-size:.85rem; font-weight:700; color:var(--muted)}
.qtext{font-weight:600; margin-bottom:12px}
.pick{font-size:.85rem; font-weight:700; color:var(--pink); margin:-6px 0 10px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; background:#fff; border:3px solid var(--line); border-radius:16px; padding:11px 14px; line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--cyan); transform:translateX(3px)}
.opt .let{flex:none; width:30px; height:30px; border-radius:50%; background:#ede9fe; font-weight:700; display:grid; place-items:center}
.opt.sel{border-color:var(--violet); background:#f5f3ff} .opt.sel .let{background:var(--violet); color:#fff}
.opt.right{border-color:var(--good); background:var(--goodbg)} .opt.right .let{background:var(--good); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--badbg); opacity:.75} .opt.wrong .let{background:var(--bad); color:#fff}
.opt.fix{border-color:var(--blue); background:var(--fix)} .opt.fix .let{background:var(--blue); color:#fff}
.opt:disabled{cursor:default}
.slots{display:flex; flex-direction:column; gap:8px; margin-bottom:10px}
.slot{display:flex; gap:10px; align-items:center; min-height:50px; border:3px dashed #cbd5e1; border-radius:14px; background:#fff; padding:8px 12px; text-align:left}
.slot .n{flex:none; width:28px; height:28px; border-radius:50%; background:var(--ink); color:#fff; font-weight:700; display:grid; place-items:center; font-size:.85rem}
.slot.filled{border-style:solid; border-color:var(--ink)} .slot.right{border-color:var(--good); background:var(--goodbg)} .slot.wrong{border-color:var(--bad); background:var(--badbg)} .slot.fix{border-color:var(--blue); background:var(--fix); border-style:solid}
.chips{display:flex; flex-direction:column; gap:8px}
.chip{background:#ecfeff; border:3px solid var(--cyan); border-radius:14px; padding:9px 12px; text-align:left; font-weight:500}
.chip.used{display:none}
.mt{width:100%; border-collapse:separate; border-spacing:0 8px}
.mt th{font-size:.85rem; color:var(--violet); padding:0 4px}
.mt th:first-child{text-align:left}
.mt td{background:#fff; padding:10px; vertical-align:middle}
.mt td:first-child{border-radius:14px 0 0 14px; font-size:.95rem}
.mt td:last-child{border-radius:0 14px 14px 0}
.mt tr.rok td{background:var(--goodbg)} .mt tr.rfix td{background:var(--fix)}
.cb{width:44px; height:44px; border-radius:12px; border:3px solid #d6d3e8; background:#f8f7fc; display:block; margin:0 auto; font-size:1.05rem}
.cb.sel{background:var(--violet); border-color:#5b21b6; color:#fff} .cb.right{background:var(--good); border-color:#166534; color:#fff} .cb.x{opacity:.35}
.fb{margin-top:14px}
.fbbox{border-radius:16px; padding:12px 16px; display:flex; gap:12px; align-items:flex-start; animation:pop .3s}
.fbbox .em{font-size:1.9rem; line-height:1}
.fbbox h4{margin:0 0 2px; font-size:1.1rem}
.fbbox p{margin:0}
.fbbox.good{background:var(--goodbg); border:3px solid var(--good)} .fbbox.hint{background:var(--hint); border:3px solid var(--gold)} .fbbox.fix{background:var(--badbg); border:3px solid var(--bad)}
.qfoot{display:flex; justify-content:flex-end; gap:10px; margin-top:14px; flex-wrap:wrap}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.flash{background:var(--hint)!important; box-shadow:0 0 0 3px var(--gold)}
.float{position:fixed; z-index:50; font-family:var(--disp); font-size:1.5rem; color:var(--gold); text-shadow:0 2px 0 #78350f; pointer-events:none; animation:up 1.1s forwards}
@keyframes up{to{transform:translateY(-80px); opacity:0}}
#toast{position:fixed; left:50%; top:90px; transform:translateX(-50%) translateY(-220px); z-index:60; background:var(--violet); color:#fff; padding:12px 22px; border-radius:16px; font-family:var(--disp); box-shadow:var(--shadow); transition:transform .5s cubic-bezier(.3,1.5,.6,1); text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:55}

/* results */
.big{font-size:5rem; text-align:center}
.sgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:14px 0}
.sgrid div{background:#fff; border-radius:16px; padding:14px; text-align:center; border-bottom:6px solid var(--cyan)}
.sgrid b{display:block; font-family:var(--disp); font-size:1.8rem; color:var(--violet)}
.badges{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.badge{background:#fff; border:3px solid var(--gold); border-radius:16px; padding:10px; width:150px; text-align:center}
.badge.off{opacity:.35; filter:grayscale(1); border-color:#ccc}
.badge .ic{font-size:2rem} .badge b{display:block; font-size:.9rem} .badge small{font-size:.75rem; color:var(--muted)}
.review{background:#fff; border-radius:16px; padding:14px 18px; margin-top:12px; border:2px solid var(--line)}
footer{color:rgba(255,255,255,.65); text-align:center; font-size:.78rem; padding:0 16px 22px}
@media (max-width:900px){ .split{grid-template-columns:1fr} .pane{position:relative; top:0; max-height:55vh} .hero{grid-template-columns:1fr; text-align:center} .hero img{margin:0 auto; width:160px; height:160px} }
@media (max-width:560px){ body{font-size:16.5px} .panel{padding:16px} .hud{order:3; min-width:100%} }
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

<script>
const LESSON = [{"title": "Why Did the Author Write This?", "icon": "🎯", "body": ["An author's purpose is the reason for writing. Authors write to inform, to persuade, to entertain, to explain, or to describe.", "Many texts have more than one purpose. A biography can inform you about a person's life and also inspire you. An article can give facts to inform you and then use those facts to persuade you.", "To find the purpose, ask: What does the author want me to know, think, feel, or do?"], "check": {"t": "multi", "q": "A travel blog tells funny stories about getting lost on a hiking trail. Then it urges readers to visit the park this summer. Which TWO purposes does the author have?", "o": ["to entertain", "to persuade", "to explain how to build a tent", "to teach the history of hiking"], "a": [0, 1], "h": "Look at the two parts of the blog. The funny stories do one job. Urging readers to visit does another.", "x": "The funny stories entertain, and urging readers to visit the park persuades. The blog does not explain tents or teach history.", "label": null}}, {"title": "Topic vs. Central Idea", "icon": "💡", "body": ["The topic is what the text is about, usually one or two words, like volcanoes or friendship.", "The central idea is the main point or insight the author wants to share about that topic. It is a complete sentence.", "Topic: sleep. Central idea: Teens need more sleep than most of them get, and it affects how well they learn."], "check": {"t": "mc", "q": "Which of these is a CENTRAL IDEA, not just a topic?", "o": ["Volunteering at an animal shelter taught me to be patient.", "animal shelters", "dogs and cats", "volunteering"], "a": 0, "h": "A central idea is a full sentence that makes a point. Which choice says something about the topic?", "x": "\"Volunteering at an animal shelter taught me to be patient\" is a full sentence with an insight. The others are only topics.", "label": null}}, {"title": "Explicit or Implied?", "icon": "🔍", "body": ["An explicit central idea is stated directly. You can point to the sentence that says it.", "An implied central idea is not stated. You have to look at the details, notice what they have in common, and draw a conclusion based on evidence.", "Writers of arguments usually state their idea explicitly. Writers of stories, memoirs, and biographies often let the details show it."], "check": {"t": "match", "q": "Decide if each mini text has an EXPLICIT or IMPLIED central idea.", "rows": ["\"Recycling saves energy, and every family should do it. Here is why.\"", "\"Grandpa's hands shook as he tied the fishing line, but he still checked every knot twice, just like he taught me.\""], "cols": ["Explicit", "Implied"], "a": [0, 1], "h": "Is there a sentence that directly tells the main point? Or do you have to figure it out from the details?", "x": "The recycling text states its point directly, so it is explicit. The Grandpa text never states the idea, so you have to infer it from details: he is careful and still teaching. That is implied.", "label": null}}, {"title": "How a Central Idea Develops", "icon": "🧱", "body": ["A central idea is built across the whole text, like a wall built brick by brick.", "Authors develop it with facts, examples, events, quotes, and explanations. Each paragraph adds something new: a problem, a reason, a turning point, or a conclusion.", "To analyze development, ask about each paragraph: What does this part add to the big idea?"], "check": null}, {"title": "Purpose and Central Idea Work Together", "icon": "🔗", "body": ["In a biography or a descriptive text, the author chooses a subject that interests them, finds meaning in it, and shares that meaning as the central idea.", "So the purpose and the central idea are closely connected. If an author writes to inspire you with a person's life, the central idea is usually the lesson that person's life teaches.", "When you know one, use it to check the other."], "check": null}, {"title": "Your Vault-Cracking Strategy", "icon": "🗝️", "body": ["Step 1. Preview the title and the type of text.", "Step 2. Ask why the author wrote it: inform, persuade, entertain, explain, or describe?", "Step 3. Track ideas that repeat or build from paragraph to paragraph.", "Step 4. Find the sentence that states the central idea. If there isn't one, build your own sentence from the details.", "Step 5. Test it: does every paragraph support your central idea? If not, revise it."], "check": null}], P1 = {"id": "p1", "name": "Vault 1", "title": "Bessie Coleman: Wings of Her Own", "type": "Biography", "paras": ["In the early 1900s, Bessie Coleman worked long hours at a barbershop in Chicago. Customers who had come home from World War I told stories about pilots in France. Bessie listened closely. She decided that she would fly.", "There was a problem. No flight school in the United States would accept her because she was a Black woman. Bessie did not give up. She took French classes at night, saved her money, and sailed to France in 1920.", "In France, she trained in fragile wooden planes. She watched another student die in a crash, but she kept training. In 1921, she earned her pilot's license, becoming the first African American woman to do so.", "Back in the United States, Bessie performed daring air shows. She refused to perform anywhere that made Black audience members use a separate gate from white audience members. She dreamed of opening a flight school so that others would not face the barriers she had faced."], "qs": [{"t": "mc", "q": "What is the author's main purpose for writing this passage?", "o": ["to inform readers about Bessie Coleman's life and show how determined she was", "to persuade readers to become pilots", "to entertain readers with a made-up adventure story", "to explain how early airplanes were built"], "a": 0, "h": "Is this a true story about a real person? What does the author want you to learn and feel about her?", "x": "The passage gives true facts about Bessie Coleman's life (informing), and the details are chosen to show her determination. It does not ask readers to become pilots or explain how planes work.", "label": null}, {"t": "mc", "q": "Which statement BEST expresses the central idea of the passage?", "o": ["Bessie Coleman's determination helped her overcome unfair barriers to become a pilot, and she used her success to fight for others.", "Flying planes in the 1920s was dangerous.", "Bessie Coleman worked at a barbershop in Chicago.", "France had better airplanes than the United States."], "a": 0, "h": "A central idea covers the WHOLE passage, from the barbershop all the way to the air shows. Which choice includes all of it?", "x": "Every paragraph adds to one idea: Bessie faced unfair barriers, refused to quit, became a pilot, and then fought for fairness. The other choices are small details or ideas not in the text.", "label": null}, {"t": "mc", "q": "Is the central idea of this passage explicit or implied?", "o": ["Implied, because the author shows Bessie's determination through her actions but never states the main idea in one sentence", "Explicit, because the first sentence states the main idea", "Explicit, because the title tells the whole central idea", "Implied, because the passage does not include any details"], "a": 0, "h": "Look for one sentence that states the big idea about Bessie's life. Can you find it, or do you have to put it together from her actions?", "x": "No single sentence states the central idea. Readers infer it from her actions: learning French, going to France, continuing after a crash, and refusing unfair rules. That makes it implied.", "label": null}, {"t": "multi", "q": "Which TWO details BEST develop the central idea that Bessie was determined to overcome barriers?", "o": ["She took French classes at night, saved her money, and sailed to France in 1920.", "She watched another student die in a crash, but she kept training.", "Customers who had come home from World War I told stories about pilots in Fr const V = {
  ok: 'speechSynthesis' in window, list: [], auto: false, token: 0, btn: null,
  load(){ if(this.ok) this.list = speechSynthesis.getVoices().filter(v => /^en[-_]us/i.test(v.lang)); },
  pick(){ const L = this.list; return L.find(v => /google us english/i.test(v.name)) || L.find(v => /google/i.test(v.name)) || L.find(v => /samantha|aria|jenny|ava|allison|zira/i.test(v.name)) || L[0] || null; },
  clear(){ $$('.reading').forEach(e => e.classList.remove('reading')); },
  stop(){ this.token++; if(this.ok) speechSynthesis.cancel(); this.clear(); if(this.btn){ this.btn.classList.remove('playing'); this.btn.textContent = this.btn.dataset.l; this.btn = null; } },
  run(segs, btn){
    this.stop(); if(!this.ok || !segs.length) return;
    if(!this.list.length) this.load();
    const my = ++this.token, v = this.pick();
    if(btn){ this.btn = btn; btn.dataset.l = btn.dataset.l || btn.textContent; btn.classList.add('playing'); btn.textContent = '⏹ Stop'; }
    const parts = []; segs.forEach(s => (s.t.match(/[^.!?]+[.!?"”]*\s*/g) || [s.t]).forEach(t => parts.push({ el: s.el, t: t.trim() })));
    let i = 0;
    const next = () => {
      if(my !== this.token) return; this.clear();
      if(i >= parts.length){ this.stop(); return; }
      const s = parts[i++]; if(!s.t) return next(); if(s.el) s.el.classList.add('reading');
      const u = new SpeechSynthesisUtterance(s.t);
      if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = .95; u.onend = () => setTimeout(next, 90); u.onerror = () => setTimeout(next, 90);
      speechSynthesis.resume(); speechSynthesis.speak(u);
    };
    next();
  },
  clean: t => t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim(),
  els(root){ const L = root.matches && root.matches('[data-read]') ? [root] : $$('[data-read]', root); return L.filter(el => el.offsetParent !== null || el.getClientRects().length).map(el => ({ el, t: this.clean(el.dataset.say || el.innerText) })).filter(s => s.t); },

function burst(n = 120){ const cols = ['#22d3ee','#f472b6','#a3e635','#fbbf24','#8b5cf6','#fb923c'];
  for(let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 260, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, s: Math.random() * 8 + 5, c: cols[i % cols.length], r: Math.random() * 6, life: 150 });

        <span id="lsay"></span><button class="btn" id="next" ${c.check && !S.res.lesson[i] ? 'disabled' : ''}>${i === LESSON.length - 1 ? 'Enter Vault 1 ➜' : 'Next ➜'}</button></div></div></div>`;
    $('#lsay').append(sayBtn('🔊 Read card', () => $('.lbody')));
    $('#prev').onclick = () => { i--; SFX.click(); show(); };
    $('#next').onclick = () => { SFX.click(); if(i < LESSON.length - 1){ i++; show(); } else go(2); };
    if(c.check){
      if(S.res.lesson[i]) $('#chk').innerHTML = `<div class="fbbox good"><div class="em">✅</div><div><h4>Quick check done!</h4><p>${esc(c.check.x)}</p></div></div>`;
      else renderQ({ ...c.check, label: 'Quick Check' }, $('#chk'), { last: false, noNext: true, onDone: r => { S.res.lesson[i] = r; $('#next').disabled = false; } });
    }
    V.autoRead($('.lbody'));
  };
  show();
}

/* ---------- passage pane ---------- */
function passage(blk){
  const texts = blk.texts || [{ h: blk.title, paras: blk.paras }];
  const pane = document.createElement('section'); pane.className = 'pane';
  pane.innerHTML = `${texts.length > 1 ? `<div class="tabs">${texts.map((t, k) => `<button data-k="${k}">${esc(t.h.split(':')[0])}</button>`).join('')}</div>` : ''}<div class="pbody"></div>`;
  const body = $('.pbody', pane);
  texts.forEach((t, k) => {
    const sec = document.createElement('div'); sec.className = 'ptx'; sec.dataset.k = k; sec.style.display = k ? 'none' : 'block';
    sec.innerHTML = `<div class="ptitle"><h3 data-read>${esc(t.h)}</h3></div><span class="ptype">${esc(texts.length > 1 ? (k ? 'Personal narrative' : 'Informational article') : blk.type)}</span>
      ${t.paras.map((p, j) => `<div class="para" id="${blk.id}-${k}-${j + 1}"><button class="pn" title="Read paragraph ${j + 1}">${j + 1}</button><p data-read>${esc(p)}</p></div>`).join('')}`;
    $('.ptitle', sec).append(sayBtn('🔊 Read to me', () => sec));
    $$('.pn', sec).forEach(b => b.onclick = () => V.read(b.nextElementSibling));
    body.append(sec);
  });
  const tab = k => { $$('.tabs button', pane).forEach(b => b.classList.toggle('on', +b.dataset.k === k)); $$('.ptx', pane).forEach(s => s.style.display = +s.dataset.k === k ? 'block' : 'none'); };
  $$('.tabs button', pane).forEach(b => b.onclick = () => { SFX.click(); tab(+b.dataset.k); });
  tab(0); pane.tab = tab;
  return pane;
}

/* ---------- vault ---------- */
function vault(blk, key, nextStep){
  S.res[key] = [];
  const quiz = key === 'quiz';
  app.innerHTML = `<div class="panel" style="margin-bottom:14px; padding:16px 22px"><div class="row" style="justify-content:space-between">
      <div><h2 class="disp" style="color:${quiz ? 'var(--pink)' : 'var(--violet)'}; margin:0">${quiz ? '👑 ' : '🔐 '}${esc(blk.name)}: ${esc(blk.title)}</h2>
      <p class="muted" style="margin:.2em 0 0" data-read>${quiz ? 'This is your quiz. Read both texts, then answer 8 questions. Use the tabs to switch texts. You still get a hint and one more try.' : 'Read the passage. Then solve 6 puzzles to crack the vault. Tap a paragraph number to hear just that paragraph.'}</p></div>
      <span id="vsay"></span></div></div>
    <div class="split"><div id="ph"></div><div><div class="qtop"><div class="qdots" id="qd"></div><span id="qc"></span></div><div id="qh"></div></div></div>`;
  $('#vsay').append(sayBtn('🔊 Directions', () => $('.panel')));
  const pane = passage(blk); $('#ph').append(pane);
  let i = 0;
  const step = () => {
    const q = blk.qs[i];
    $('#qd').innerHTML = blk.qs.map((_, k) => { const r = S.res[key][k]; return `<span class="${k === i ? 'cur' : !r ? '' : r.pts === 2 ? 'ok' : r.pts === 1 ? 'ok2' : 'miss'}">${k + 1}</span>`; }).join('');
    $('#qc').textContent = `${i + 1} of ${blk.qs.length}`;
    renderQ({ ...q, label: (quiz ? 'Question ' : 'Puzzle ') + (i + 1) + (q.label ? ' · ' + q.label : '') }, $('#qh'), { last: i === blk.qs.length - 1, onDone: r => { S.res[key][i] = r; }, onNext: () => { i++; if(i < blk.qs.length){ step(); if(innerWidth <= 900) $('#qh').scrollIntoView({ behavior: 'smooth' }); } else vaultDone(blk, key, nextStep); } });
  };
  step();
}
function vaultDone(blk, key, nextStep){
  const R = S.res[key], pts = R.reduce((a, r) => a + r.pts, 0), pct = Math.round(pts / (R.length * 2) * 100);
  if(key === 'quiz'){ go(5); return; }
  burst(160); SFX.win();
  app.innerHTML = `<div class="panel center"><div class="big">🔓</div><h1 class="disp" style="color:var(--violet)" data-read>${esc(blk.name)} Cracked!</h1>
    <p data-read>You scored ${pct} percent. ${R.filter(r => r.pts === 2).length} of ${R.length} on the first try.</p>
    <p class="muted" data-read>${pct >= 80 ? 'Strong work, agent. You are ready for the next vault.' : 'Good effort. Look back at the hints you got. They show exactly what to watch for in the next vault.'}</p>
    <div class="row c"><span id="dsay"></span><button class="btn go" id="nx">${nextStep === 4 ? 'Enter Vault 2 ➜' : 'Enter the Master Vault ➜'}</button></div></div>`;
  $('#dsay').append(sayBtn('🔊 Read to me', () => app));
  $('#nx').onclick = () => go(nextStep);
  V.autoRead(app);
}

/* ---------- question engine: hint on 1st miss, wrong + answer on 2nd ---------- */
function renderQ(q, host, ctx){
  host.innerHTML = '';
  let tries = 0, over = false;
  const card = document.createElement('div'); card.className = 'qcard';
  card.innerHTML = `<div class="qhead"><span class="qnum">${esc(q.label || 'Puzzle')}</span><span class="tries" id="tl">🎯 2 tries</span></div>
    <div class="qtext" data-read>${esc(q.q)}</div>${q.t === 'multi' ? `<div class="pick">Choose ${q.a.length} answers.</div>` : ''}
    <div id="body"></div><div class="fb" id="fb"></div><div class="qfoot" id="foot"></div>`;
  host.append(card);
  const body = $('#body', card), fb = $('#fb', card), foot = $('#foot', card), tl = $('#tl', card);
  const rq = document.createElement('button'); rq.className = 'say'; rq.textContent = '🔊 Read question'; foot.append(rq);
  rq.onclick = e => { e.stopPropagation(); if(rq.classList.contains('playing')){ V.stop(); return; } V.run(V.els($('.qtext', card)).concat(V.els(body)), rq); };
  const box = (cls, em, title, text) => {
    fb.innerHTML = `<div class="fbbox ${cls}"><div class="em">${em}</div><div><h4 data-read>${title}</h4><p data-read>${esc(text)}</p></div></div>`;
    V.autoRead(fb); fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  const praise = ['Vault cracked!', 'Sharp thinking!', 'Access granted!', 'Nailed it!', 'Agent-level reading!'];
  const finish = pts => {
    over = true; ctx.onDone && ctx.onDone({ pts, q: q.q, label: q.label });
    addXP(pts === 2 ? 10 : pts === 1 ? 5 : 0, tl);
    tl.textContent = pts === 2 ? '⭐ First try!' : pts === 1 ? '💪 Second try!' : '📘 Study this one';
    if(ctx.noNext) return;
    const nx = document.createElement('button'); nx.className = 'btn go'; nx.textContent = ctx.last ? 'Finish ➜' : 'Next ➜';
    nx.onclick = () => { SFX.click(); V.stop(); ctx.onNext(); };
    foot.append(nx); setTimeout(() => nx.focus(), 60);
  };
  const flashPara = () => { $$('.para.flash').forEach(p => p.classList.remove('flash')); };
  const miss1 = (extra = '') => { SFX.oops(); card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 450); tries = 1; tl.textContent = '🎯 1 try left'; box('hint', '🤔', 'Not quite. Here is a hint.', q.h + extra + ' Try one more time.'); };
  const miss2 = () => { SFX.oops(); flashPara(); box('fix', '❌', 'Wrong. Here is the correct answer.', q.x); finish(0); };
  const right = () => { SFX.good(); burst(40); flashPara(); box('good', '🎉', praise[Math.floor(Math.random() * praise.length)], q.x); finish(tries ? 1 : 2); };

  if(q.t === 'mc' || q.t === 'multi'){
    const multi = q.t === 'multi', ans = multi ? q.a : [q.a];
    const opts = shuffle(q.o.map((t, k) => ({ t, ok: ans.includes(k) })));
    body.innerHTML = `<div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}" data-read data-say="${esc(String.fromCharCode(65 + k) + '. ' + o.t)}"><span class="let">${String.fromCharCode(65 + k)}</span><span>${esc(o.t)}</span></button>`).join('')}</div>${multi ? '<div class="row" style="justify-content:flex-end; margin-top:10px"><button class="btn" id="mchk" disabled>Check ✔</button></div>' : ''}`;
    const btns = $$('.opt', body); let sel = new Set();
    const grade = () => {
      V.stop();
      const picked = [...sel], ok = picked.length === ans.length && picked.every(k => opts[k].ok);
      if(ok){ picked.forEach(k => { btns[k].classList.remove('sel'); btns[k].classList.add('right'); }); btns.forEach(b => b.disabled = true); const m = $('#mchk', body); if(m) m.remove(); right(); return; }
      if(tries === 0){
        let keep = 0;
        picked.forEach(k => { if(!opts[k].ok){ btns[k].classList.remove('sel'); btns[k].classList.add('wrong'); btns[k].disabled = true; sel.delete(k); } else keep++; });
        if(multi){ $('#mchk', body).disabled = true; miss1(keep ? ' One of your choices is correct, so keep it and change the other.' : ' Neither choice was correct.'); } else miss1();
        return;
      }
      picked.forEach(k => { if(!opts[k].ok){ btns[k].classList.remove('sel'); btns[k].classList.add('wrong'); } });
      opts.forEach((o, k) => { if(o.ok){ btns[k].classList.remove('sel'); btns[k].classList.add('fix'); } });
      btns.forEach(b => b.disabled = true); const m = $('#mchk', body); if(m) m.remove(); miss2();
    };
    btns.forEach(b => b.onclick = () => {
      if(over || b.disabled) return; SFX.click(); const k = +b.dataset.k;
      if(!multi){ sel = new Set([k]); grade(); return; }
      if(sel.has(k)){ sel.delete(k); b.classList.remove('sel'); } else if(sel.size < ans.length){ sel.add(k); b.classList.add('sel'); }
      $('#mchk', body).disabled = sel.size !== ans.length;
    });
    if(multi) $('#mchk', body).onclick = grade;
  }
  else if(q.t === 'order'){
    const items = shuffle(q.o.map((t, k) => ({ t, k })));
    let placed = Array(q.o.length).fill(null), locked = Array(q.o.length).fill(false), busy = false;
    const draw = state => {
      body.innerHTML = `<div class="slots">${placed.map((p, j) => `<button class="slot ${p ? 'filled' : ''} ${locked[j] ? 'right' : ''} ${state && !locked[j] ? state : ''}" data-j="${j}"><span class="n">${j + 1}</span><span>${p ? esc(p.t) : '<span class="muted">Tap a choice below</span>'}</span></button>`).join('')}</div>
        <div class="chips">${items.map(it => `<button class="chip ${placed.includes(it) ? 'used' : ''}" data-k="${it.k}" data-read>${esc(it.t)}</button>`).join('')}</div>`;
      $$('.slot', body).forEach(s => s.onclick = () => { const j = +s.dataset.j; if(over || busy || locked[j] || !placed[j]) return; placed[j] = null; SFX.click(); draw(); });
      $$('.chip', body).forEach(c => c.onclick = () => { if(over || busy) return; const it = items.find(x => x.k === +c.dataset.k), j = placed.findIndex(p => p === null); if(j < 0) return; placed[j] = it; SFX.click(); draw(); if(placed.every(Boolean)){ busy = true; setTimeout(check, 350); } });
    };
    const check = () => {
      V.stop();
      if(placed.every((p, j) => p.k === j)){ locked = locked.map(() => true); draw(); right(); return; }
      if(tries === 0){ let n = 0; placed.forEach((p, j) => { if(p.k === j){ locked[j] = true; n++; } }); draw('wrong'); miss1(n ? ` ${n} ${n === 1 ? 'is' : 'are'} in the right spot and will stay green.` : '');
        setTimeout(() => { placed = placed.map((p, j) => locked[j] ? p : null); busy = false; draw(); }, 1300); return; }
      placed = q.o.map((t, k) => items.find(x => x.k === k)); draw(); $$('.slot', body).forEach((s, j) => { if(!locked[j]) s.classList.add('fix'); }); miss2();
    };
    draw();
  }
  else if(q.t === 'match'){
    let sel = q.rows.map(() => null), locked = q.rows.map(() => false);
    body.innerHTML = `<table class="mt"><thead><tr><th></th>${q.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${q.rows.map((rw, i) => `<tr><td data-read>${esc(rw)}</td>${q.cols.map((c, j) => `<td><button class="cb" data-j="${j}" aria-label="${esc(c)}"></button></td>`).join('')}</tr>`).join('')}</tbody></table>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="mchk" disabled>Check ✔</button></div>`;
    const rows = $$('tbody tr', body), chkB = $('#mchk', body);
    rows.forEach((tr, i) => $$('.cb', tr).forEach(b => b.onclick = () => { if(over || locked[i] || b.disabled) return; SFX.click(); $$('.cb', tr).forEach(x => { x.classList.remove('sel'); if(!x.classList.contains('x')) x.textContent = ''; }); b.classList.add('sel'); b.textContent = '✔'; sel[i] = +b.dataset.j; chkB.disabled = sel.some(v => v === null); }));
    chkB.onclick = () => {
      V.stop();
      if(sel.every((v, i) => v === q.a[i])){ rows.forEach((tr, i) => { tr.classList.add('rok'); $$('.cb', tr)[q.a[i]].className = 'cb right'; }); chkB.remove(); right(); return; }
      if(tries === 0){ let n = 0;
        rows.forEach((tr, i) => { if(sel[i] === q.a[i]){ locked[i] = true; tr.classList.add('rok'); $$('.cb', tr)[sel[i]].className = 'cb right'; n++; } else { const w = $$('.cb', tr)[sel[i]]; w.className = 'cb x'; w.textContent = '✖'; w.disabled = true; sel[i] = null; } });
        chkB.disabled = true; miss1(` You have ${n} of ${q.rows.length} rows right. Fix the rows that are not green.`); return; }
      rows.forEach((tr, i) => { $$('.cb', tr).forEach(x => { x.classList.remove('sel'); if(!x.classList.contains('x')) x.textContent = ''; }); const c = $$('.cb', tr)[q.a[i]]; c.className = 'cb right'; c.textContent = '✔'; if(!locked[i]) tr.classList.add('rfix'); });
      chkB.remove(); miss2();
    };
  }
  if(V.auto) setTimeout(() => V.run(V.els($('.qtext', card)).concat(V.els(body))), 250);
}

/* ---------- results ---------- */
function results(){
  const R = S.res, sum = a => a.reduce((x, r) => x + r.pts, 0);
  const qp = Math.round(sum(R.quiz) / (QUIZ.qs.length * 2) * 100);
  const practice = R.p1.concat(R.p2), pp = practice.length ? Math.round(sum(practice) / (practice.length * 2) * 100) : 0;
  const firsts = [...R.lesson.filter(Boolean), ...practice, ...R.quiz].filter(r => r.pts === 2).length;
  const missed = R.quiz.filter(r => r.pts < 2);
  const badges = [
    ['📚', 'Trained Agent', 'Finished every training card', R.lesson.filter(Boolean).length === LESSON.filter(c => c.check).length],
    ['🔐', 'Vault Breaker', 'Cracked both practice vaults', R.p1.length === P1.qs.length && R.p2.length === P2.qs.length],
    ['💪', 'Comeback', 'Used a hint and got it right', [...practice, ...R.quiz].some(r => r.pts === 1)],
    ['👑', 'Master Locksmith', 'Scored 80% or higher on the quiz', qp >= 80],
    ['💎', 'Flawless', 'Every quiz question on the first try', R.quiz.length === QUIZ.qs.length && R.quiz.every(r => r.pts === 2)]];
  if(qp >= 80){ burst(220); SFX.win(); } else SFX.good();
  app.innerHTML = `<div class="panel"><div class="big">${qp >= 80 ? '🏆' : '🔑'}</div>
    <h1 class="disp center" style="color:var(--violet)" data-read>Mission Complete, ${esc(S.name || 'Agent')}!</h1>
    <p class="center" data-read>Your rank is ${rankFor(S.xp)}, with ${S.xp} XP.</p>
    <div class="sgrid"><div style="border-color:var(--pink)"><b>${qp}%</b>Master Vault quiz</div><div><b>${pp}%</b>Practice vaults</div><div style="border-color:var(--lime)"><b>${firsts}</b>first-try answers</div></div>
    <div class="badges">${badges.map(([ic, n, d, on]) => `<div class="badge ${on ? '' : 'off'}"><div class="ic">${ic}</div><b>${n}</b><small>${d}</small></div>`).join('')}</div>
    <div class="review"><h3 data-read>${missed.length ? 'Quiz questions to review' : 'You aced every quiz question on the first try!'}</h3>
      ${missed.length ? `<ul>${missed.map(r => `<li>${esc(r.q)}${r.pts === 1 ? ' <i>(correct on second try)</i>' : ''}</li>`).join('')}</ul>` : ''}
      <p data-read style="margin-bottom:0"><b>Remember:</b> Ask why the author wrote the text. Find the stated central idea, or build one from the details. Then check that every paragraph supports it.</p></div>
    <p class="center muted" style="font-size:.85rem; margin-top:12px">Show this screen to your teacher. Finished ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}.</p>
    <div class="row c"><span id="rsay"></span><button class="btn" id="again">🔁 Retry the Master Vault</button><button class="btn ghost" id="restart">Start over</button></div></div>`;
  $('#rsay').append(sayBtn('🔊 Read to me', () => app));
  $('#again').onclick = () => { S.xp -= R.quiz.reduce((a, r) => a + (r.pts === 2 ? 10 : r.pts === 1 ? 5 : 0), 0); hud(); go(4); };
  $('#restart').onclick = () => { Object.assign(S, { xp: 0, step: 0, unlocked: 0, res: { lesson: [], p1: [], p2: [], quiz: [] } }); hud(); go(0); };
  V.autoRead(app);
}

hud(); drawMap(); briefing();
</script>
